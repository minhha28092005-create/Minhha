spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # =========================
            # AUTH SERVICE
            # =========================
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}


            # =========================
            # API KEY MANAGEMENT - LIST
            # =========================
            - id: auth-service-apikeys-list
              uri: http://localhost:8081
              predicates:
                - Path=/api/api-keys
              filters:
                - RewritePath=/api/api-keys, /api-keys


            # =========================
            # API KEY MANAGEMENT - DETAIL
            # =========================
            - id: auth-service-apikeys-detail
              uri: http://localhost:8081
              predicates:
                - Path=/api/api-keys/**
              filters:
                - RewritePath=/api/api-keys/(?<segment>.*), /api-keys/${segment}


            # =========================
            # COURSE SERVICE - LIST
            # =========================
            - id: course-service-list
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses


            # =========================
            # COURSE SERVICE - DETAIL
            # =========================
            - id: course-service-detail
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/${segment}


            # =========================
            # REGISTRATION SERVICE - LIST
            # =========================
            - id: registration-service-list
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations


            # =========================
            # REGISTRATION SERVICE - DETAIL
            # =========================
            - id: registration-service-detail
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/${segment}


            # =========================
            # PUBLIC COURSE API
            # =========================
            - id: course-service-public
              uri: http://localhost:8082
              predicates:
                - Path=/api/public/courses
              filters:
                - RewritePath=/api/public/courses, /courses


          # =========================
          # CORS
          # =========================
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"


